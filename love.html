<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸Love Compliment 🌸</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#ffafbd,#ffc3a0,#ffd6ff);
    font-family:'Montserrat',sans-serif;
    overflow:hidden;
    position:relative;
}

.container{
    background:rgba(255,255,255,0.3);
    backdrop-filter:blur(15px);
    padding:35px;
    border-radius:25px;
    text-align:center;
    width:340px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    font-family:'Dancing Script', cursive;
    color:#ff2e63;
    font-size:38px;
}

input{
    width:90%;
    padding:10px;
    border-radius:20px;
    border:none;
    text-align:center;
    outline:none;
    font-size:15px;
}

button{
    margin-top:15px;
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#ff2e63,#ff6b81);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(255,46,99,0.4);
}

button:hover{
    transform:scale(1.08);
}

.compliment{
    margin-top:20px;
    font-weight:600;
    color:#6a0572;
    min-height:60px;

    white-space: normal !important;
    word-break: normal !important;
    overflow-wrap: normal !important;
    letter-spacing: normal !important;
    word-spacing: normal !important;
}

.signature{
    margin-top:20px;
    font-family:'Dancing Script', cursive;
    font-size:24px;
    color:#ff2e63;
}

.float{
    position:absolute;
    font-size:18px;
    animation:moveUp 7s linear infinite;
    opacity:0.8;
    pointer-events:none;
}

@keyframes moveUp{
    0%{transform:translateY(100vh); opacity:0;}
    50%{opacity:1;}
    100%{transform:translateY(-10vh); opacity:0;}
}
</style>
</head>

<body>

<div class="container">
    <h1>💖 Just For You 💖</h1>
    <input type="text" id="nameInput" placeholder="তোমার নাম লিখ!💖">
    <br>
    <button onclick="startLove()">সারপ্রাইজ দেখো!😊</button>
    <div class="compliment" id="complimentText"></div>
    <div id="signature" class="signature">Love With, Apon 💘</div>
    <p style="font-size:14px; text-align:end;" >Develop by<br>Apon</p>
</div>
<script>
const compliments = [
"তুমি সত্যিই অসাধারণ 💕",
"তোমার হাসি আমার পৃথিবী আলোকিত করে ✨",
"তুমি আমার জীবনের সবচেয়ে সুন্দর অনুভূতি ❤️",
"তোমাকে ছাড়া কিছুই ভাবতে পারি না 💞",
"তুমি স্বপ্নের থেকেও বেশি সুন্দর 🌹",
"তুমি আমার হৃদয়ের রানী 💖",
"তুমি আমার জীবনের সবচেয়ে সুন্দর অনুভূতি 💖",
"তোমার হাসি দেখলেই আমার পুরো দিনটা ভালো হয়ে যায় 😊",
"তোমার চোখের দিকে তাকালে মনে হয় আমি স্বপ্নে আছি ✨",
"তুমি আমার জীবনের সবচেয়ে প্রিয় মানুষ 🌸",
"তোমাকে ভাবলেই হৃদয়টা অদ্ভুত শান্তি পায় 💞",
"তুমি আমার পৃথিবীর সবচেয়ে সুন্দর মেয়ে 🌹",
"তোমার সাথে কাটানো প্রতিটা মুহূর্ত আমার কাছে অমূল্য 💎",
"তুমি আমার হৃদয়ের সবচেয়ে নিরাপদ জায়গা ❤️",
"তোমাকে ছাড়া আমার পৃথিবীটা অসম্পূর্ণ 💔➡️❤️",
"তুমি আমার জীবনের সবচেয়ে সুন্দর গল্প 📖💖",
"তোমার হাসি আমার সবচেয়ে প্রিয় জিনিস 😍",
"তুমি আমার সব স্বপ্নের কারণ ✨",
"তুমি থাকলে পৃথিবীটা আরও সুন্দর লাগে 🌍💞",
"তুমি আমার হৃদয়ের সবচেয়ে মিষ্টি মানুষ 🍯",
"তোমার সাথে কথা বললেই মনটা ভালো হয়ে যায় 🌸",
"তুমি আমার জীবনের সবচেয়ে সুন্দর আশীর্বাদ 💫",
"তুমি আমার ভালোবাসার সবচেয়ে প্রিয় নাম ❤️",
"তুমি আমার হৃদয়ের সবচেয়ে উজ্জ্বল তারা ⭐",
"তুমি আমার জীবনের সবচেয়ে প্রিয় মানুষদের মধ্যে এক নম্বর 💖",
"তোমাকে ছাড়া আমার পৃথিবী কল্পনাই করতে পারি না 💞"
];

let started = false;
let usedIndexes = [];

function typeEffect(text){
    const el = document.getElementById("complimentText");
    el.textContent = "";   // IMPORTANT
    let i = 0;

    const typing = setInterval(()=>{
        if(i < text.length){
            el.textContent += text[i];
            i++;
        }else{
            clearInterval(typing);
        }
    },40);
}

function startLove(){
    if(started) return;
    started = true;
    changeCompliment();
}

function changeCompliment(){
    const name = document.getElementById("nameInput").value.trim();
    if(name === ""){
        alert("নাম লিখো 💕");
        started = false;
        return;
    }

    if(usedIndexes.length === compliments.length){
        usedIndexes = [];
    }

    let randomIndex;
    do{
        randomIndex = Math.floor(Math.random()*compliments.length);
    }while(usedIndexes.includes(randomIndex));

    usedIndexes.push(randomIndex);

    const message = name + ", " + compliments[randomIndex];

    typeEffect(message);

    setTimeout(changeCompliment, 2500);
}

function createFloating(){
    const name = document.getElementById("nameInput").value.trim() || "";
    const tvSignature = document.getElementById('signature');
    tvSignature.innerText = `Miss You, ${name}  💘`
    const div = document.createElement("div");
    div.classList.add("float");

    const emojis = ["💖","Only For You","🌸","You Are My Mine","💞","My Heart","😍","My World","💌", "You Are My Happiness"];
    div.innerText = `${emojis[Math.floor(Math.random()*emojis.length)]} ${name}`;

    div.style.left = Math.random()*100 + "vw";
    div.style.fontSize = (14 + Math.random()*16) + "px";
    div.style.animationDuration = (5 + Math.random()*5) + "s";

    document.body.appendChild(div);

    setTimeout(()=>div.remove(),7000);
}

setInterval(createFloating,400);
</script>

</body>
</html>
